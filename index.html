<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <link rel="shortcut icon" href="./jobs.png" type="image/x-icon" />

    <!-- tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main class="w-full min-h-screen bg-slate-900 text-white">
      <!-- header -->
      <section class="max-w-7xl h-full mx-auto bg-slate-700 p-5">
        <!-- title -->
        <h1 class="text-4xl capitalize font-semibold">job application tracker</h1>
        <!-- jobs container -->
        <div class="w-full h-fit mt-5 flex gap-5">
          <!-- total jobs -->
          <div class="bg-slate-600 p-4 flex-1">
            <p class="capitalize text-xl font-semibold">total</p>
            <h2 id="totalJobs" class="text-2xl font-semibold">0</h2>
          </div>
          <!-- interview jobs -->
          <div class="bg-slate-600 p-4 flex-1">
            <p class="capitalize text-xl font-semibold">interview</p>
            <h2 id="interviewJobs" class="text-2xl text-green-500 font-semibold">0</h2>
          </div>
          <!-- rejected jobs -->
          <div class="bg-slate-600 p-4 flex-1">
            <p class="capitalize text-xl font-semibold">rejected</p>
            <h2 id="rejectedJobs" class="text-2xl text-red-500 font-semibold">0</h2>
          </div>
        </div>
      </section>

      <!-- available jobs -->
      <section class="max-w-7xl mx-auto h-fit mt-5 bg-slate-700 p-5">
        <!-- available jobs title -->
        <div class="flex justify-between">
          <h1 class="capitalize text-3xl font-semibold">available jobs</h1>
          <p class="capitalize text-2xl"><span>0</span> jobs</p>
        </div>

        <!-- jobs tabs -->
        <div class="flex gap-5 mt-5">
          <button class="capitalize text-xl bg-slate-600 px-10 py-2 rounded-md">all</button>

          <button class="capitalize text-xl bg-slate-600 px-10 py-2 rounded-md">interview</button>

          <button class="capitalize text-xl bg-slate-600 px-10 py-2 rounded-md">rejected</button>
        </div>

        <!-- jobs container -->
        <div id="jobsContainer" class="mt-5 space-y-5"></div>
      </section>
    </main>

    <!-- link to js file -->
    <script src="./index.js"></script>
  </body>
</html>
