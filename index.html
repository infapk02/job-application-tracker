<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <link rel="shortcut icon" href="./jobs.png" type="image/x-icon" />

    <!-- tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main class="w-full min-h-screen bg-slate-900 text-white">
      <!-- header -->
      <section class="max-w-7xl h-full mx-auto bg-slate-700 p-5">
        <!-- title -->
        <h1 class="text-4xl capitalize font-semibold">job application tracker</h1>
        <!-- jobs container -->
        <div class="w-full h-fit mt-5 flex gap-5">
          <!-- total jobs -->
          <div class="bg-slate-600 p-4 flex-1">
            <p class="capitalize text-xl font-semibold">total</p>
            <h2 class="text-2xl font-semibold">0</h2>
          </div>
          <!-- interview jobs -->
          <div class="bg-slate-600 p-4 flex-1">
            <p class="capitalize text-xl font-semibold">interview</p>
            <h2 class="text-2xl text-green-500 font-semibold">0</h2>
          </div>
          <!-- rejected jobs -->
          <div class="bg-slate-600 p-4 flex-1">
            <p class="capitalize text-xl font-semibold">rejected</p>
            <h2 class="text-2xl text-red-500 font-semibold">0</h2>
          </div>
        </div>
      </section>

      <!-- available jobs -->
      <section class="max-w-7xl mx-auto h-fit mt-5 bg-slate-700 p-5">
        <!-- available jobs title -->
        <div class="flex justify-between">
          <h1 class="capitalize text-3xl font-semibold">available jobs</h1>
          <p class="capitalize text-2xl"><span>0</span> jobs</p>
        </div>

        <!-- jobs tabs -->
        <div class="flex gap-5 mt-5">
          <button class="capitalize text-xl bg-slate-600 px-10 py-2 rounded-md">all</button>

          <button class="capitalize text-xl bg-slate-600 px-10 py-2 rounded-md">interview</button>

          <button class="capitalize text-xl bg-slate-600 px-10 py-2 rounded-md">rejected</button>
        </div>

        <!-- jobs container -->
        <div class="mt-5">
          <!-- job card -->
          <div class="bg-slate-600 p-3 space-y-5">
            <!-- job title -->
            <div class="flex justify-between items-center">
              <div>
                <h3 class="text-3xl capitalize font-medium">job title</h3>
                <p class="text-base capitalize">designation</p>
              </div>
              <div
                class="w-10 h-10 flex justify-center items-center hover:bg-red-500 cursor-pointer bg-slate-500 rounded-full"
              >
                <i class="fa-solid fa-trash"></i>
              </div>
            </div>

            <!-- options -->
            <ul class="flex gap-5">
              <li class="capitalize">option-1</li>
              <li class="capitalize">option-2</li>
              <li class="capitalize">option-3</li>
            </ul>

            <!-- applied button -->
            <div class="space-y-1">
              <button class="text-base bg-slate-500 px-4 py-1.5 rounded-md uppercase font-medium">not applied</button>
              <p class="capitalize">description</p>
            </div>

            <!-- interview btn and rejected btn -->
            <div class="flex gap-4">
              <button
                class="text-base uppercase px-4 py-1.5 border-2 border-green-500 rounded-md font-medium text-green-500 hover:bg-green-500 hover:text-white cursor-pointer"
              >
                interview
              </button>

              <button
                class="text-base uppercase px-4 py-1.5 border-2 border-red-500 rounded-md font-medium text-red-500 hover:bg-red-500 hover:text-white cursor-pointer"
              >
                rejected
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
